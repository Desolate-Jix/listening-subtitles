name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Application and caption tests (no API calls)
        run: dotnet run --project tests/ListeningSubtitles.Tests.csproj -c Release
      - name: Realtime transcription tests (fake audio)
        run: dotnet run --project tests/Speech/SpeechTests.csproj -c Release
      - name: Publish Windows application
        shell: pwsh
        run: ./scripts/build.ps1
